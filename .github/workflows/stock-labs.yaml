name: DSK Stock labs
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsk-stock-lab04-github-actions
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install -g pnpm@8.15.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter dsk-stock-backend exec jest --runInBand --passWithNoTests
      - run: pnpm --filter dsk-stock-frontend exec vitest run
      - run: pnpm --filter dsk-stock-frontend exec tsc --noEmit
      - run: pnpm build
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.4
      - run: helm lint chart -f chart/values.lab04.yaml
  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: Image name
        id: image
        shell: bash
        env:
          LAB_REPOSITORY: ${{ github.repository }}
          LAB_COMPONENT: ${{ matrix.component }}
        run: echo "name=ghcr.io/${LAB_REPOSITORY,,}-${LAB_COMPONENT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: dsk-stock-lab04-github-actions
          file: dsk-stock-lab04-github-actions/apps/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
  deploy:
    name: Deploy to K3s
    needs: [verify, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]

    permissions:
      contents: read

    concurrency:
      group: stock-lab04-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify Kubernetes access
        env:
          KUBECONFIG: /home/github-runner/.kube/config
        run: |
          test "$(kubectl auth can-i update deployments -n stock-lab04)" = "yes"
          helm status stock -n stock-lab04

      - name: Deploy with Helm
        env:
          KUBECONFIG: /home/github-runner/.kube/config
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install stock \
            ./dsk-stock-lab04-github-actions/chart \
            --namespace stock-lab04 \
            --values ./dsk-stock-lab04-github-actions/chart/values.lab04.yaml \
            --set-string backend.image=ghcr.io/prod0751/lab-devops-backend:${IMAGE_TAG} \
            --set-string frontend.image=ghcr.io/prod0751/lab-devops-frontend:${IMAGE_TAG} \
            --atomic \
            --wait \
            --wait-for-jobs \
            --timeout 10m

      - name: Verify deployment
        env:
          KUBECONFIG: /home/github-runner/.kube/config
        run: |
          kubectl rollout status deployment/backend \
            -n stock-lab04 --timeout=180s

          kubectl rollout status deployment/frontend \
            -n stock-lab04 --timeout=180s

          helm status stock -n stock-lab04

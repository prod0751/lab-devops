apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: stock-vault
spec:
  provider:
    vault:
      server: http://vault.vault-lab07.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-access
          key: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stock
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: stock-vault
    kind: SecretStore
  target:
    name: stock-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: stock

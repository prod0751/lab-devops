{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: stock-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@postgres:5432/%s" .Values.secrets.postgresUser .Values.secrets.postgresPassword .Values.secrets.postgresDb | quote }}
  JWT_SECRET: {{ required "Set secrets.jwtSecret or existingSecret" .Values.secrets.jwtSecret | quote }}
{{- end }}
